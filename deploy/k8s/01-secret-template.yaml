apiVersion: v1
kind: Secret
metadata:
  name: agentpulse-secrets
  namespace: agentpulse
  labels:
    app: agentpulse
type: Opaque
stringData:
  # DATABASE_URL controls the storage backend:
  #   "" (empty)          → SQLite at /app/data/agentpulse.db (default; no extra setup required)
  #   "postgres://..."    → PostgreSQL; the app runs Drizzle migrations on boot
  #
  # To opt into Postgres, set this to your connection string, e.g.:
  #   postgres://agentpulse:<PASSWORD>@your-postgres-host:5432/agentpulse
  #
  # See deploy/k8s/overlays/postgres/ for a ready-to-use Kustomize overlay that
  # also removes the SQLite backup sidecar and wires Postgres-specific settings.
  #
  # Create the database first (Postgres path only):
  #   psql -h your-postgres-host -U psadmin -c "CREATE USER agentpulse WITH PASSWORD '<password>';"
  #   psql -h your-postgres-host -U psadmin -c "CREATE DATABASE agentpulse OWNER agentpulse ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C' TEMPLATE template0;"
  DATABASE_URL: ""

  # Maximum Postgres connection-pool size. Ignored when DATABASE_URL is empty (SQLite).
  # Tune based on your Postgres server's max_connections and the number of replicas.
  AGENTPULSE_PG_POOL_MAX: "10"

  # Initial API key for hook authentication (optional - auto-generated on first start if empty)
  AGENTPULSE_INITIAL_API_KEY: ""

  # Forwardauth shared-secret trust gate. Generate with: openssl rand -hex 32
  # See deploy/k8s/FORWARDAUTH.md for full setup instructions.
  # Leave empty to disable the trust gate (not recommended for production).
  #
  # Bound to both FORWARDAUTH_TRUST_SECRET and AGENTPULSE_AUTHENTIK_TRUST_SECRET
  # env vars in 04-deployment.yaml for one-release back-compat. Operators using
  # the old secret key name should rename this field to FORWARDAUTH_TRUST_SECRET;
  # the old name AGENTPULSE_AUTHENTIK_TRUST_SECRET is deprecated and will be
  # removed in the next release.
  FORWARDAUTH_TRUST_SECRET: ""
