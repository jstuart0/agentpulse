apiVersion: v1
kind: Secret
metadata:
  name: agentpulse-secrets
  namespace: agentpulse
  labels:
    app: agentpulse
type: Opaque
stringData:
  # PostgreSQL connection on your-postgres-host
  # Create the database first:
  #   psql -h your-postgres-host -U psadmin -c "CREATE USER agentpulse WITH PASSWORD '<password>';"
  #   psql -h your-postgres-host -U psadmin -c "CREATE DATABASE agentpulse OWNER agentpulse ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C' TEMPLATE template0;"
  DATABASE_URL: "postgresql://agentpulse:<PASSWORD>@your-postgres-host:5432/agentpulse"

  # Initial API key for hook authentication (optional - auto-generated on first start if empty)
  AGENTPULSE_INITIAL_API_KEY: ""

  # Authentik shared-secret trust gate. Must match the static value returned by the
  # "agentpulse-verify-header" property mapping in Authentik Admin → Customisation →
  # Property Mappings. Generate with: openssl rand -hex 32
  # See deploy/k8s/AUTHENTIK-FORWARDAUTH.md for full setup instructions.
  # Leave empty to disable the trust gate (not recommended for production).
  AGENTPULSE_AUTHENTIK_TRUST_SECRET: ""
