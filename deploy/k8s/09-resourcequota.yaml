apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentpulse-quota
  namespace: agentpulse
spec:
  hard:
    # Compute guardrails — prevents a misconfigured deployment from starving
    # other workloads on the single-node homelab cluster.
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    # Object-count guardrails.
    pods: "10"
    services: "10"
    persistentvolumeclaims: "5"
    secrets: "20"
    configmaps: "20"
