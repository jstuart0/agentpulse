apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agentpulse-https
  namespace: agentpulse
spec:
  entryPoints:
    - websecure
  routes:
    # Health + hook ingestion — public, no auth, no rate limit.
    # Hooks carry per-key in-process rate limiting (P7); always-200 contract
    # forbids edge-level 429s on these paths.
    - match: Host(`agentpulse.example.com`) && Path(`/api/v1/health`)
      kind: Rule
      services:
        - name: agentpulse
          port: 3000

    - match: Host(`agentpulse.example.com`) && Path(`/api/v1/hooks`)
      kind: Rule
      services:
        - name: agentpulse
          port: 3000

    - match: Host(`agentpulse.example.com`) && Path(`/api/v1/hooks/status`)
      kind: Rule
      services:
        - name: agentpulse
          port: 3000

    # Supervisors surface — public at the edge; per-handler auth enforced server-side.
    # Supervisor agents run on remote machines and cannot hold an Authentik SSO session.
    # Each endpoint carries explicit in-process auth:
    #   GET  /supervisors, /supervisors/:id, POST /enroll, /rotate, /revoke
    #        → requireAuth() (dashboard API-key or Authentik session)
    #   POST /register → enrollment token or supervisor credential (checked in-handler)
    #   POST /heartbeat, /launches/claim, /launches/:id/status, /managed-session-state,
    #        /managed-sessions/:id/events, /provider-sync, /control-actions/*
    #        → requireSupervisorAuth() (supervisor credential token)
    # The API-key Bearer bypass rule above covers requireAuth() callers that use ap_ keys.
    # requireSupervisorAuth() uses a separate supervisor token scheme; no Authentik session needed.
    - match: Host(`agentpulse.example.com`) && PathPrefix(`/api/v1/supervisors`)
      kind: Rule
      services:
        - name: agentpulse
          port: 3000

    # Block internal operational endpoints from public access — defense-in-depth.
    # internal.ts enforces loopback-only at the TCP layer; this rule ensures the
    # path is never reachable through the ingress at all, even if that check were
    # somehow bypassed. Routing to a non-existent service causes Traefik to return
    # 503, which is intentional: the endpoint must not be publicly addressable.
    # Priority: this rule must appear before the catch-all Host(...) rule.
    # NOT rate-limited: 503 is already the response; no need for an additional guard.
    - match: Host(`agentpulse.example.com`) && PathPrefix(`/api/v1/internal`)
      kind: Rule
      services:
        - name: agentpulse-deny-internal
          port: 9999

    # ── Public endpoints — rate-limited (S-22, I-M5) ─────────────────────────
    # These paths are unauthenticated and script-reachable; rate limiting is
    # defense-in-depth against abuse / enumeration.

    # Telegram webhook: HMAC-authenticated via X-Telegram-Bot-Api-Secret-Token.
    # Rate limit is secondary guard; HMAC is the primary.
    - match: Host(`agentpulse.example.com`) && Path(`/api/v1/channels/telegram/webhook`)
      kind: Rule
      middlewares:
        - name: agentpulse-ratelimit-public
          namespace: agentpulse
      services:
        - name: agentpulse
          port: 3000

    # Setup / installer scripts — public download paths.
    - match: Host(`agentpulse.example.com`) && Path(`/setup.sh`)
      kind: Rule
      middlewares:
        - name: agentpulse-ratelimit-public
          namespace: agentpulse
      services:
        - name: agentpulse
          port: 3000

    - match: Host(`agentpulse.example.com`) && Path(`/setup-relay.sh`)
      kind: Rule
      middlewares:
        - name: agentpulse-ratelimit-public
          namespace: agentpulse
      services:
        - name: agentpulse
          port: 3000

    - match: Host(`agentpulse.example.com`) && Path(`/install-local.sh`)
      kind: Rule
      middlewares:
        - name: agentpulse-ratelimit-public
          namespace: agentpulse
      services:
        - name: agentpulse
          port: 3000

    - match: Host(`agentpulse.example.com`) && Path(`/install-local.ps1`)
      kind: Rule
      middlewares:
        - name: agentpulse-ratelimit-public
          namespace: agentpulse
      services:
        - name: agentpulse
          port: 3000

    # CSP violation reports — unauthenticated browser push (P4).
    - match: Host(`agentpulse.example.com`) && Path(`/api/v1/csp-report`)
      kind: Rule
      middlewares:
        - name: agentpulse-ratelimit-public
          namespace: agentpulse
      services:
        - name: agentpulse
          port: 3000

    # ── Authenticated surface ─────────────────────────────────────────────────

    # API-key-bearing requests bypass Authentik forwardauth so the
    # relay (statusline, hook backfill, off-Authentik device reads)
    # can call the dashboard API surface. Hono's per-router
    # requireAuth() still validates the key — this just frees the
    # request from the upstream SSO 302 that would otherwise convert
    # JSON callers into login HTML. Scoped to /api/ to keep the
    # browser dashboard catch-all unaffected.
    - match: Host(`agentpulse.example.com`) && PathPrefix(`/api/`) && HeaderRegexp(`Authorization`, `Bearer ap_.*`)
      kind: Rule
      middlewares:
        - name: agentpulse-strip-client-authentik
          namespace: agentpulse
      services:
        - name: agentpulse
          port: 3000

    # Dashboard frontend - Authentik protected.
    # Strip order: agentpulse-strip-client-authentik runs first so any
    # client-forged X-Authentik-* headers are removed before forwardAuth
    # evaluates the request. Only the forwardAuth response can re-inject them.
    - match: Host(`agentpulse.example.com`)
      kind: Rule
      middlewares:
        - name: agentpulse-strip-client-authentik
          namespace: agentpulse
        - name: agentpulse-forwardauth
          namespace: agentpulse
      services:
        - name: agentpulse
          port: 3000
  tls:
    secretName: agentpulse-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agentpulse-http
  namespace: agentpulse
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`agentpulse.example.com`)
      kind: Rule
      services:
        - name: agentpulse
          port: 3000
      middlewares:
        - name: https-redirect
          namespace: agentpulse
