apiVersion: v1
kind: ConfigMap
metadata:
  name: agentpulse-config
  namespace: agentpulse
  labels:
    app: agentpulse
data:
  PORT: "3000"
  HOST: "0.0.0.0"
  PUBLIC_URL: "https://agentpulse.example.com"
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  # Peers whose X-Forwarded-For is believed: the ingress controller's pod network.
  # Without it every request looks like it comes from the ingress, and per-client
  # limits (pairing failures, auth throttles) all count against one address.
  # "<ingress-pod-cidr>" is a placeholder: REPLACE it with the CIDR of the INGRESS
  # (Traefik) pods, for example "192.0.2.0/24" (a documentation range; use your own).
  # Not your cluster's whole pod range: every address listed here
  # can set the client address AgentPulse sees (login throttles, pairing limits,
  # CSP-report limits), so a range that covers ordinary workloads lets any pod in
  # it pick its own. If the range is wrong, AgentPulse logs a
  # trusted_proxies_unverified warning after the first 25 non-loopback requests.
  AGENTPULSE_TRUSTED_PROXIES: "<ingress-pod-cidr>"
  # ── Forwardauth header customisation ──────────────────────────────────────
  # Defaults shown — uncomment and override for non-Authentik providers.
  # These env vars couple to the header names in 06-middleware.yaml: when you
  # override a header name here, also update the corresponding middleware
  # resource in your private overlay so the YAML and the app stay in sync.
  # See deploy/k8s/FORWARDAUTH.md for provider-specific values.
  #
  # Provider label (used in /auth/me and dashboard UI).
  # Only "authentik" triggers the Authentik sign-out URL; all other values
  # are treated as generic forwardauth providers (signOutUrl returns null).
  # FORWARDAUTH_PROVIDER: "authentik"
  #
  # Header carrying the authenticated username.
  # FORWARDAUTH_HEADER_USERNAME: "X-Authentik-Username"
  #
  # Header carrying the authenticated email address.
  # FORWARDAUTH_HEADER_EMAIL: "X-Authentik-Email"
  #
  # Header carrying group memberships (comma-separated).
  # FORWARDAUTH_HEADER_GROUPS: "X-Authentik-Groups"
  #
  # Header carrying the user's display name.
  # FORWARDAUTH_HEADER_NAME: "X-Authentik-Name"
  #
  # Header carrying the unique user identifier.
  # FORWARDAUTH_HEADER_UID: "X-Authentik-Uid"
  #
  # Header used to carry the trust secret from Traefik to AgentPulse.
  # Must match the header injected by agentpulse-inject-verify in 06-middleware.yaml.
  # FORWARDAUTH_HEADER_VERIFY: "X-Authentik-Verify"
  #
  # Prefix of all IdP identity headers to strip before forwardauth runs.
  # agentpulse-strip-client-forwardauth removes these by exact name; this
  # env var tells AgentPulse which prefix to expect from the IdP.
  # FORWARDAUTH_HEADER_STRIP_PREFIX: "X-Authentik-"

  # ── Teams (optional) ──────────────────────────────────────────────────────
  # Everything below is off by default: an install runs in solo mode (every
  # signed-in user sees everything, nothing about ownership is enforced) until
  # an admin turns team mode on in Settings, or you pin it here.
  #
  # Pin the instance mode. "team" turns on members, admins and owner-checked
  # actions and locks the mode (the UI can't change it); "solo" locks it the
  # other way. Team mode needs authentication and at least one way to sign in
  # as an admin (a local bootstrap admin or a subject listed below), or the
  # server refuses to start.
  # AGENTPULSE_MODE: "solo"
  #
  # Comma-separated identity-provider subjects (the stable uid, never a display
  # username) who are admins. Keep it to uids; a username can be handed to
  # someone else by the identity provider.
  # AGENTPULSE_ADMIN_SSO_SUBJECTS: ""
  #
  # In team mode, how many new sessions one person (or, for a key with no owner,
  # one key) may create per minute before the rest are dropped. Default 120.
  # AGENTPULSE_SESSION_CREATE_LIMIT: "120"
  #
  # Session summary: the time limit of one model call, in seconds (30 to 1800,
  # default 360). Slow local models on large sessions may need more. The summary
  # lease and the failure breaker window follow it; use one value on every replica.
  # AGENTPULSE_SESSION_SUMMARY_TIMEOUT_SECONDS: "360"
  #
  # Ask: time limit of the answering model call and of a per-session Q&A answer,
  # in seconds (30 to 1800, default 180).
  # AGENTPULSE_ASK_ANSWER_TIMEOUT_SECONDS: "180"
  #
  # Short helper calls (Ask intent classifiers, Ask query expansion, alert-rule
  # yes/no check): time limit in seconds (5 to 300, default 20).
  # AGENTPULSE_AI_HELPER_TIMEOUT_SECONDS: "20"
  #
  # Time limit of the attempt on the "quick calls" provider, in seconds (1 to 60,
  # default 5); on failure the call is repeated on the default provider.
  # AGENTPULSE_AI_FAST_PROVIDER_TIMEOUT_SECONDS: "5"
