apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentpulse-sa
  namespace: agentpulse
  labels:
    app: agentpulse
# Disable automatic service account token mounting (I-H3).
# agentpulse does not call the Kubernetes API; the projected token would
# be an unused credential in /var/run/secrets/kubernetes.io/serviceaccount/
# that any code-execution vulnerability could exfiltrate and use to query
# the cluster API. Disabled here and cross-enforced in the Deployment
# (automountServiceAccountToken: false on the pod spec is redundant but
# left explicit in the pod template for clarity in kubectl describe output).
automountServiceAccountToken: false
