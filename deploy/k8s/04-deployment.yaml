apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentpulse
  namespace: agentpulse
  labels:
    app: agentpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentpulse
  template:
    metadata:
      labels:
        app: agentpulse
    spec:
      # 30s preStop budget + 60s post-TERM grace = 90s total to drain.
      # preStop runs first (sets shuttingDown=true, polls inFlight=0),
      # then SIGTERM is sent; if drain completes before 90s, k8s sends
      # SIGTERM and the process exits cleanly. After 90s: SIGKILL.
      # Residual loss under SIGKILL is the documented Option B tradeoff.
      terminationGracePeriodSeconds: 90
      containers:
      - name: agentpulse
        image: ghcr.io/YOUR_ORG/agentpulse:latest  # Replace with your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: TZ
          value: "America/New_York"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agentpulse-secrets
              key: DATABASE_URL
        - name: AGENTPULSE_INITIAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: agentpulse-secrets
              key: AGENTPULSE_INITIAL_API_KEY
        envFrom:
        - configMapRef:
            name: agentpulse-config
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  # Trigger drain via loopback-only endpoint.
                  # Sets shuttingDown=true so readiness probe goes 503
                  # and k8s stops routing new hooks to this pod.
                  # oven/bun:1-slim is Debian-based and ships wget.
                  wget -qO- --post-data="" http://127.0.0.1:3000/api/v1/internal/drain || true
                  # Poll until in-flight reaches 0 or the 30s budget runs out.
                  # sed extracts the numeric value of "inFlight" from the JSON body.
                  for i in $(seq 1 30); do
                    INFLIGHT=$(wget -qO- http://127.0.0.1:3000/api/v1/health 2>/dev/null | sed -n 's/.*"inFlight":\([0-9]*\).*/\1/p')
                    if [ "$INFLIGHT" = "0" ]; then
                      exit 0
                    fi
                    sleep 1
                  done
                  # Best-effort drain timeout — Option B accepts residual loss;
                  # Synology backup pipeline (P11) covers it.
                  exit 0
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: agentpulse-data
