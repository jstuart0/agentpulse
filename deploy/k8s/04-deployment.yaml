apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentpulse
  namespace: agentpulse
  labels:
    app: agentpulse
spec:
  replicas: 1
  # Recreate: SQLite WAL cannot tolerate two concurrent writers.
  # Old pod terminates fully before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentpulse
  template:
    metadata:
      labels:
        app: agentpulse
    spec:
      # 30s preStop budget + 60s post-TERM grace = 90s total to drain.
      # preStop runs first (sets shuttingDown=true, polls inFlight=0),
      # then SIGTERM is sent; if drain completes before 90s, k8s sends
      # SIGTERM and the process exits cleanly. After 90s: SIGKILL.
      # Residual loss under SIGKILL is the documented Option B tradeoff.
      terminationGracePeriodSeconds: 90
      # Non-root pod security context (I-H1, I-H2).
      # runAsUser 1000 = bun user in oven/bun:1-slim.
      # fsGroup 1000 makes the PVC mount group-writable by GID 1000 so
      # the bun process (which is in group 1000) can write agentpulse.db.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Dedicated service account with no token auto-mount (I-H3).
      # automountServiceAccountToken repeated here for clarity in kubectl describe;
      # the ServiceAccount-level flag is authoritative, but the pod-spec field
      # makes the intent unambiguous in any per-resource audit.
      serviceAccountName: agentpulse-sa
      automountServiceAccountToken: false
      containers:
      - name: agentpulse
        # Pin to a specific SHA-tagged image (C4).
        # IMPORTANT: this SHA is a placeholder from the last release tag.
        # Before running kubectl apply, build and push the current HEAD:
        #   ./scripts/build-and-push.sh
        # then update the tag below to the printed SHA (or apply via the
        # homelab overlay which overrides this field — see deploy/k8s/README.md).
        image: ghcr.io/jstuart0/agentpulse:b9b796c
        # IfNotPresent: SHA-tagged images are immutable; re-pulling is wasteful.
        # Always-pull would also race with the Recreate strategy (C5).
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: TZ
          value: "America/New_York"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agentpulse-secrets
              key: DATABASE_URL
        - name: AGENTPULSE_INITIAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: agentpulse-secrets
              key: AGENTPULSE_INITIAL_API_KEY
        envFrom:
        - configMapRef:
            name: agentpulse-config
        volumeMounts:
        - name: data
          mountPath: /app/data
        # /tmp is required by the bun runtime when readOnlyRootFilesystem
        # is true; without this mount the pod will crash on any temp-file
        # operation (I-H4, I-H5).
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        # Container-level hardening (I-H4, I-H5).
        # readOnlyRootFilesystem: true prevents any write to the image
        # filesystem; only the emptyDir/PVC mounts above are writable.
        # drop ALL capabilities: bun serving HTTP on port 3000 (>1024)
        # does not need any Linux capabilities.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        lifecycle:
          preStop:
            exec:
              command:
                - /usr/local/bin/bun
                - --eval
                - |
                  // Trigger drain via loopback-only endpoint.
                  // Sets shuttingDown=true so readiness probe goes 503
                  // and k8s stops routing new hooks to this pod.
                  //
                  // NOTE: oven/bun:1-slim does NOT ship wget or curl.
                  // bun is always present in the container and supports
                  // fetch(), making it the correct tool for this script.
                  try {
                    await fetch("http://127.0.0.1:3000/api/v1/internal/drain", { method: "POST" });
                  } catch {}
                  // Poll until in-flight reaches 0 or the 30s budget runs out.
                  for (let i = 0; i < 30; i++) {
                    try {
                      const res = await fetch("http://127.0.0.1:3000/api/v1/health");
                      const body = await res.json();
                      if (body.inFlight <= 0) process.exit(0);
                    } catch {}
                    await Bun.sleep(1000);
                  }
                  // Best-effort drain timeout — Option B accepts residual loss;
                  // Synology backup pipeline (P11) covers it.
                  process.exit(0);
        # startupProbe: gives the pod 150s (30 attempts × 5s) to complete
        # migrations and mark DB ready before liveness kicks in (S-24, I-M1).
        # The health route returns 503 until markDbReady() fires.
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: agentpulse-data
      # /tmp writable scratch for the bun runtime under readOnlyRootFilesystem (I-H4).
      - name: tmp
        emptyDir: {}
