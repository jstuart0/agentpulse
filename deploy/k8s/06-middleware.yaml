apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agentpulse-forwardauth
  namespace: agentpulse
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      # Trust gate header — emitted by Authentik property mapping "agentpulse-verify-header".
      # The agentpulse pod verifies this against AGENTPULSE_AUTHENTIK_TRUST_SECRET.
      # See deploy/k8s/AUTHENTIK-FORWARDAUTH.md for setup instructions.
      - X-Authentik-Verify
---
# Strip client-supplied X-Authentik-* headers BEFORE the forwardAuth middleware
# runs so an attacker cannot forge Authentik identity or the trust-gate header.
# After this strip, only the forwardAuth response can re-introduce these headers.
# Apply this middleware FIRST in every protected IngressRoute (before agentpulse-forwardauth).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agentpulse-strip-client-authentik
  namespace: agentpulse
spec:
  headers:
    customRequestHeaders:
      X-Authentik-Verify: ""
      X-authentik-username: ""
      X-authentik-groups: ""
      X-authentik-email: ""
      X-authentik-name: ""
      X-authentik-uid: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: agentpulse
spec:
  redirectScheme:
    permanent: true
    port: "443"
    scheme: https
---
# Rate-limit middleware for public (unauthenticated) endpoints (S-22, I-M5).
#
# Applied to: /api/v1/channels/telegram/webhook, /setup.sh, /setup-relay.sh,
#             /install-local.sh, /install-local.ps1, /api/v1/csp-report.
#
# NOT applied to /api/v1/hooks or /api/v1/hooks/status — those routes carry
# an in-process per-key rate limiter (P7) and must never return 429 (always-
# 200 contract). Adding edge-level rate limiting there would break agents.
#
# HMAC verification remains the primary guard for the Telegram webhook;
# this middleware is defense-in-depth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agentpulse-ratelimit-public
  namespace: agentpulse
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1m
