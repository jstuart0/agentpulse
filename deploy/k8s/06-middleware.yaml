# Traefik middlewares for AgentPulse forwardauth SSO.
#
# Header names are env-var-coupled. The defaults below match Authentik
# (X-Authentik-*). To use Authelia, oauth2-proxy, Pomerium, or another
# provider, override these resources via your private overlay AND set the
# matching FORWARDAUTH_HEADER_* env vars in agentpulse-config (see
# 02-configmap.yaml). See deploy/k8s/FORWARDAUTH.md for provider-specific
# setup instructions.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agentpulse-forwardauth
  namespace: agentpulse
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      # These are defaults for Authentik. Operators using a different IdP
      # override this resource via overlay AND set the matching
      # FORWARDAUTH_HEADER_* env vars in 02-configmap.yaml.
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      # Trust gate header — injected by agentpulse-inject-verify (below).
      # AgentPulse verifies this against FORWARDAUTH_TRUST_SECRET.
      # See deploy/k8s/FORWARDAUTH.md for setup instructions.
      - X-Authentik-Verify
---
# Strip client-supplied IdP headers BEFORE the forwardAuth middleware runs
# so an attacker cannot forge identity or the trust-gate header.
# After this strip, only the forwardAuth response can re-introduce these headers.
# Apply this middleware FIRST in every protected IngressRoute (before agentpulse-forwardauth).
#
# These are defaults for Authentik. Operators using a different IdP override
# this resource via overlay AND set FORWARDAUTH_HEADER_STRIP_PREFIX (and the
# individual FORWARDAUTH_HEADER_* vars) in 02-configmap.yaml.
# See deploy/k8s/FORWARDAUTH.md for provider-specific setup instructions.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agentpulse-strip-client-forwardauth
  namespace: agentpulse
spec:
  headers:
    customRequestHeaders:
      X-Authentik-Verify: ""
      X-authentik-username: ""
      X-authentik-groups: ""
      X-authentik-email: ""
      X-authentik-name: ""
      X-authentik-uid: ""
---
# DEPRECATED: renamed to agentpulse-strip-client-forwardauth in v0.5.0; this alias removed in next release.
# Kept as a duplicate resource so existing overlays referencing the old name continue to work.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agentpulse-strip-client-authentik
  namespace: agentpulse
spec:
  headers:
    customRequestHeaders:
      X-Authentik-Verify: ""
      X-authentik-username: ""
      X-authentik-groups: ""
      X-authentik-email: ""
      X-authentik-name: ""
      X-authentik-uid: ""
---
# Inject the trust-gate shared secret on requests that have already passed
# forwardauth. AgentPulse compares this against FORWARDAUTH_TRUST_SECRET
# (src/server/auth/middleware.ts) to admit the identity claims.
#
# IMPORTANT: this middleware MUST appear AFTER agentpulse-forwardauth in the
# IngressRoute middleware chain. Order:
#   1. agentpulse-strip-client-forwardauth (removes any forged IdP headers)
#   2. agentpulse-forwardauth (IdP validates + injects identity headers)
#   3. agentpulse-inject-verify (adds shared-secret verify header)
#
# OPERATOR SETUP (replace the empty placeholder below before applying):
#   1. openssl rand -hex 32  → use as both the value here and as
#      FORWARDAUTH_TRUST_SECRET in agentpulse-secrets.
#   2. The value here is part of cluster manifests — do not commit a real
#      secret. Use a kustomize patch in your private overlay
#      (e.g. deploy/k8s-homelab/) to inject the actual value at apply time.
#
# These are defaults for Authentik. Operators using a different IdP override
# this resource via overlay AND set FORWARDAUTH_HEADER_VERIFY in
# 02-configmap.yaml to match the header name injected here.
# See deploy/k8s/FORWARDAUTH.md for provider-specific setup instructions.
#
# Why not an IdP property mapping? Identity providers populate JWT id_token
# claims, not forwardauth response headers. Header injection at the Traefik
# layer is the straightforward path. Security model still holds: the strip
# middleware (above) prevents clients forging this header, and forwardauth
# above blocks all unauthenticated requests. The shared secret is
# defense-in-depth: even if a sibling pod could spoof identity headers
# upstream of Traefik, it would also need this secret to fool AgentPulse's
# trust gate.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agentpulse-inject-verify
  namespace: agentpulse
spec:
  headers:
    customRequestHeaders:
      # CRITICAL: In Traefik, an empty string in customRequestHeaders means DELETE
      # the header — it is NOT forwarded as an empty value. This placeholder ("") means
      # AgentPulse never receives X-Authentik-Verify, the trust gate rejects every
      # forwardauth request (reason: missing_verify_header), and SSO is completely
      # non-functional. A real value MUST be injected via your private overlay patch
      # (never committed to this base manifest).
      #
      # See deploy/k8s/FORWARDAUTH.md → Step 3 for the overlay pattern.
      # See deploy/k8s/RUNBOOK-secrets-rotation.md for rotation procedure.
      X-Authentik-Verify: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: agentpulse
spec:
  redirectScheme:
    permanent: true
    port: "443"
    scheme: https
---
# Rate-limit middleware for public (unauthenticated) endpoints (S-22, I-M5).
#
# Applied to: /api/v1/channels/telegram/webhook, /setup.sh, /setup-relay.sh,
#             /install-local.sh, /install-local.ps1, /api/v1/csp-report.
#
# NOT applied to /api/v1/hooks or /api/v1/hooks/status — those routes carry
# an in-process per-key rate limiter (P7) and must never return 429 (always-
# 200 contract). Adding edge-level rate limiting there would break agents.
#
# HMAC verification remains the primary guard for the Telegram webhook;
# this middleware is defense-in-depth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agentpulse-ratelimit-public
  namespace: agentpulse
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1m
