apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentpulse-data
  namespace: agentpulse
  labels:
    app: agentpulse
  annotations:
    # IMPORTANT: persistentVolumeReclaimPolicy is a PV-level field — it is
    # silently ignored on PVC manifests for dynamically-provisioned volumes.
    # After first deployment, patch the backing PV directly to set Retain:
    #   see deploy/k8s/README.md → "PV reclaim policy" runbook.
    agentpulse.io/pv-reclaim-note: "Patch the PV to Retain; see README.md"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
