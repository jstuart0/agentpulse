name: Codex approvals (Postgres)

# The full Postgres test job in ci.yml runs only after a merge to main or dev. The Codex approval
# tables, their triggers and their guarded statements behave differently on Postgres (row locks, trigger
# functions, text comparison of ISO times), so a pull request that touches them runs those suites on
# Postgres before the merge. ingest-latency.test.ts rides along because the hook path's statement budget
# is the first thing a change to the shared tables or db client moves. The take-over suites (AGEN-115) ride
# along too: their concurrency cases lean on row locks and unique inserts, which SQLite can pass vacuously.
# So do the Claude turn guard, Stop, fork-routing and fork-approval suites (AGEN-117): the conditional lock statement, the guarded expiry
# and the Stop that takes the lock from a running prompt are Postgres-visible, and a barrier test that was
# skipped proves nothing, so a separate step fails the job if any of them reports a skip.

on:
  pull_request:
    paths:
      - "drizzle/postgres/**"
      - "src/server/db/**"
      - "src/server/services/codex-approval*"
      - "src/server/routes/codex-approvals*"
      - "src/server/routes/session-bind*"
      - "src/server/services/session-binding*"
      - "src/server/services/session-resume-lifecycle*"
      - "src/server/services/control-actions.ts"
      - "src/server/services/control-actions-claude*"
      - "src/server/services/launch-dispatch*"
      - "src/server/routes/supervisor-claude-turn*"
      - "src/server/routes/supervisors.ts"
      - "src/server/test-utils/owned-launch.ts"
      - "src/shared/managed-messages.ts"
      - "src/server/services/managed-session-state.ts"
      - "src/server/services/event-processor.ts"
      - "src/server/services/claude-fork*"
      - "src/server/services/claude-takeover*"
      - "src/server/services/authorization.ts"
      - "src/server/services/fork-live-paths*"
      - "src/server/services/ai/action-requests-service.ts"
      - "src/server/services/ask/ask-session-action-handler.ts"
      - "src/server/services/claude-approvals*"
      - "src/shared/codex-approvals.ts"
      - "src/shared/claude-approvals.ts"
      - "src/server/routes/health.ts"
      - "src/server/routes/ingest-counters.ts"
      - "src/server/routes/claude-fork*"
      - "src/server/services/ai/proposal-resolution.ts"
      - "src/server/services/session-owner-admin.ts"
      - "src/server/services/session-detail*"
      - "src/server/services/session-dto.ts"
      - "src/server/services/ai/classifier*" # AGEN-122
      - "src/server/services/ai/session-summary/**" # AGEN-122
      - "src/server/services/session-summary-service.ts" # AGEN-122
      - "src/server/services/fork-call-row*" # AGEN-122
      - ".github/workflows/codex-approvals-postgres.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-postgres:
    name: Codex approvals (Postgres backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentpulse_test
          POSTGRES_USER: agentpulse_test
          POSTGRES_PASSWORD: agentpulse_test
        ports:
          - 5432:5432
        # Same container options as ci.yml's test-postgres job: --shm-size=1gb because Docker's small
        # default starves shared memory for parallel query workers under load.
        options: >-
          --health-cmd "pg_isready -U agentpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=1gb
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests (Postgres backend)
        env:
          AGENTPULSE_TEST_BACKEND: postgres
          AGENTPULSE_TEST_PG_URL: postgres://agentpulse_test:agentpulse_test@localhost:5432/agentpulse_test
          DATABASE_URL: postgres://agentpulse_test:agentpulse_test@localhost:5432/agentpulse_test
        run: >-
          bun test
          src/server/db
          src/server/services/codex-approval
          src/server/routes/codex-approvals
          src/server/routes/ingest-latency.test.ts
          src/server/services/session-binding.test.ts
          src/server/routes/session-bind-route.test.ts
          src/server/services/session-resume-lifecycle.test.ts
          src/server/services/managed-turn-state.test.ts
          src/server/services/session-detail-fork.test.ts
          src/server/services/fork-call-row.test.ts
          src/server/services/managed-session-state.test.ts
          src/server/services/ai/classifier.test.ts
          src/server/services/ai/session-summary/evidence-loader.test.ts
          src/server/services/ai/session-summary/ledger.test.ts
          src/server/services/session-summary-plans.test.ts

      - name: Claude turn guard and Stop (Postgres backend; a skipped test fails the job)
        env:
          AGENTPULSE_TEST_BACKEND: postgres
          AGENTPULSE_TEST_PG_URL: postgres://agentpulse_test:agentpulse_test@localhost:5432/agentpulse_test
          DATABASE_URL: postgres://agentpulse_test:agentpulse_test@localhost:5432/agentpulse_test
        shell: bash
        run: |
          bun test \
            src/server/services/control-actions-claude-turn.test.ts \
            src/server/services/control-actions-claude-stop.test.ts \
            src/server/routes/supervisor-claude-turn-monitor.test.ts \
            src/server/services/claude-fork-server.test.ts \
            src/server/services/claude-approvals.test.ts \
            src/server/services/session-binding-claude.test.ts \
            src/server/services/fork-live-paths.test.ts \
            src/server/routes/claude-fork-routes.test.ts \
            src/server/services/ai/continue-decision-fork.test.ts 2>&1 | tee claude-turn.log
          if grep -Eq '^ *[1-9][0-9]* skip' claude-turn.log; then
            echo "A Claude turn guard test was skipped on Postgres." >&2
            exit 1
          fi
