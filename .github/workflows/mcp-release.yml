name: MCP Release

# Publishes the packages/agentpulse-mcp workspace member to npm as
# @agentpulse/mcp. Triggers on a `mcp-v*` tag push, or manually via
# workflow_dispatch. A workflow_dispatch run (e.g. re-running after a
# transient npm registry failure) MUST be started with the release tag
# itself selected as the ref (Actions -> Run workflow -> "Use workflow
# from" -> tag mcp-vX.Y.Z) — not a branch. The "Verify ref is the version
# tag" step below runs unconditionally and fails closed on any ref that
# isn't exactly refs/tags/mcp-v<package.json version>, so a dispatch run
# started from a branch is refused rather than silently publishing
# whatever version happens to be in package.json there.
#
# Ported from the retired standalone jstuart0/agentpulse-mcp repo's
# release workflow — that repo is retired; this workflow is now the only
# publish path for the package.
on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build, Verify, Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # id-token: write is required for npm OIDC "trusted publishing" — npm
      # exchanges this workflow's OIDC token for a short-lived publish
      # credential, no long-lived NODE_AUTH_TOKEN secret required once
      # trusted publishing is configured (see the one-time setup note
      # below). contents: read is the minimum needed to check out the repo.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (repo root — this package has no lockfile of its own)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      - name: Architecture and MCP guards (no-console-log, no-raw-register-tool, no-cross-boundary-import)
        run: bun run check:architecture

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build agentpulse-mcp package
        run: bun run build:mcp

      # check:mcp-tarball shells out to the system `npm pack` — pin the
      # Node/npm version so that behavior is deterministic across runs
      # rather than whatever npm happens to ship with the runner image
      # (matches ci.yml's own tarball-audit step).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Tarball audit
        run: bun run check:mcp-tarball

      # Unconditional by design — no `if:` guard. A push trigger always sets
      # GITHUB_REF to the pushed tag, but a workflow_dispatch run defaults to
      # whatever branch it was launched from (refs/heads/<branch>), which
      # would otherwise skip this check entirely and publish whatever
      # version happens to be in package.json on that branch. Comparing the
      # full ref (not just a stripped tag name) means a branch ref fails
      # this comparison by construction — it can never equal
      # refs/tags/mcp-v<version> — so a workflow_dispatch run MUST be
      # started with the release tag itself selected as its ref (see the
      # header comment) or this step fails closed before anything is built
      # or published.
      - name: Verify ref is the version tag
        run: |
          PKG_VERSION=$(node -p "require('./packages/agentpulse-mcp/package.json').version")
          EXPECTED_REF="refs/tags/mcp-v${PKG_VERSION}"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "::error::GITHUB_REF is '$GITHUB_REF', expected '$EXPECTED_REF' (packages/agentpulse-mcp/package.json version is '$PKG_VERSION'). If this is a workflow_dispatch run, re-run it with the tag '${EXPECTED_REF#refs/tags/}' selected as the ref (Actions -> Run workflow -> Use workflow from: tag), not a branch."
            exit 1
          fi
          echo "GITHUB_REF '$GITHUB_REF' matches packages/agentpulse-mcp/package.json version '$PKG_VERSION'."

      # --- One-time maintainer setup for npm OIDC trusted publishing ---
      # On npmjs.com: open the @agentpulse/mcp package → Settings → "Trusted
      # Publisher" → add a GitHub Actions publisher with:
      #   Organization or user: jstuart0
      #   Repository:           agentpulse
      #   Workflow filename:    mcp-release.yml
      #   Environment:          (leave blank unless this job is scoped to one)
      # Once configured, `npm publish` below authenticates via the OIDC
      # token from this job's `id-token: write` permission — no
      # NODE_AUTH_TOKEN needed. Until that's set up (e.g. for the very
      # first publish under the new scoped name), fall back to a classic
      # automation token stored as the NPM_TOKEN repo secret; npm CLI reads
      # NODE_AUTH_TOKEN from the environment when set.
      - name: Publish to npm
        working-directory: packages/agentpulse-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
