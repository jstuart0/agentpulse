services:
  agentpulse:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=debug
      - PUBLIC_URL=http://localhost:3000
      # Per-call time limit of a session summary, in seconds (30 to 1800). Empty means the default (360).
      - AGENTPULSE_SESSION_SUMMARY_TIMEOUT_SECONDS=${AGENTPULSE_SESSION_SUMMARY_TIMEOUT_SECONDS:-}
      # Time limit of an Ask answer, in seconds (30 to 1800). Empty means the default (180).
      - AGENTPULSE_ASK_ANSWER_TIMEOUT_SECONDS=${AGENTPULSE_ASK_ANSWER_TIMEOUT_SECONDS:-}
      # Time limit of the short helper calls (Ask classifiers and query expansion), in seconds (5 to 300). Empty means the default (20).
      - AGENTPULSE_AI_HELPER_TIMEOUT_SECONDS=${AGENTPULSE_AI_HELPER_TIMEOUT_SECONDS:-}
      # Time limit of the attempt on the "quick calls" provider, in seconds (1 to 60). Empty means the default (5).
      - AGENTPULSE_AI_FAST_PROVIDER_TIMEOUT_SECONDS=${AGENTPULSE_AI_FAST_PROVIDER_TIMEOUT_SECONDS:-}
    volumes:
      - agentpulse-data:/app/data
    restart: unless-stopped

volumes:
  agentpulse-data:
